
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradersKit — Secure Login</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .acct-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: left;
    }

    #status.ok { color: var(--green); }
    #status.bad { color: var(--red); }

    #demo-account {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    #continue-btn {
      margin-top: 18px;
      width: 100%;
    }
  </style>
</head>

<body class="landing-body">

  <div class="terminal-card-container"
       style="max-width:560px;margin:70px auto;text-align:center;">

    <div class="brand-logo-text" style="margin-bottom:18px;">
      <span class="logo-box-red">Traders</span>
      <span class="logo-text-white">Kit</span>
    </div>

    <h2>Connecting your Deriv account</h2>

    <p id="status"
       style="margin:14px 0;line-height:1.6;color:var(--text-muted);">
      Verifying your secure login...
    </p>

    <div id="accounts"></div>

    <div id="selection" style="display:none;text-align:left;">
      <label for="demo-account">Select your demo account</label>
      <select id="demo-account"></select>

      <button id="continue-btn" class="btn-run-bot" type="button">
        Continue to Dashboard
      </button>
    </div>

    <p id="retry" style="margin-top:18px;display:none;">
      <a href="login.html" style="color:var(--cyan);">
        Try logging in again
      </a>
    </p>

  </div>

  <script src="deriv-auth.js"></script>

  <script>
    const statusEl = document.getElementById("status");
    const accountsEl = document.getElementById("accounts");
    const selectionEl = document.getElementById("selection");
    const accountSelect = document.getElementById("demo-account");
    const continueBtn = document.getElementById("continue-btn");

    let demoAccounts = [];

    function say(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || "";
    }

    function fail(message) {
      say(message, "bad");
      document.getElementById("retry").style.display = "block";
    }

    function displayAccounts(accounts) {
      accounts.forEach(function(account) {
        const row = document.createElement("div");
        row.className = "acct-row";

        const name = document.createElement("span");
        name.textContent = account.account_id;

        const balance = document.createElement("span");
        balance.textContent =
          Number(account.balance).toFixed(2) + " " +
          (account.currency || "");

        row.appendChild(name);
        row.appendChild(balance);
        accountsEl.appendChild(row);
      });
    }

    function populateDemoAccounts(accounts) {
      demoAccounts = accounts.filter(function(account) {
        return String(account.account_type).toLowerCase() === "demo";
      });

      if (!demoAccounts.length) {
        fail(
          "No demo Options account was found. Please check your Deriv account and try again."
        );
        return;
      }

      demoAccounts.forEach(function(account, index) {
        const option = document.createElement("option");

        option.value = account.account_id;
        option.textContent =
          account.account_id + " — " +
          Number(account.balance).toFixed(2) + " " +
          (account.currency || "");

        accountSelect.appendChild(option);

        if (index === 0) {
          option.selected = true;
        }
      });

      selectionEl.style.display = "block";
      say("Your Deriv login succeeded. Select a demo account to continue.", "ok");
    }

    continueBtn.addEventListener("click", function() {
      const accountId = accountSelect.value;

      if (!accountId) {
        fail("Please select a demo account.");
        return;
      }

      try {
        DerivAuth.setSelectedAccount(accountId);

        continueBtn.disabled = true;
        continueBtn.textContent = "Opening dashboard...";

        window.location.assign("dashboard.html");

      } catch (error) {
        fail("Could not save your account selection. Please try again.");
        continueBtn.disabled = false;
        continueBtn.textContent = "Continue to Dashboard";
      }
    });

    (async function() {

      if (window.location.origin !== DerivAuth.SITE) {
        fail("Please use https://traderskit.site for login.");
        return;
      }

      const params = new URLSearchParams(window.location.search);

      const code = params.get("code");
      const state = params.get("state");
      const oauthError = params.get("error");
      const errorDescription = params.get("error_description");

      // Remove OAuth parameters from the visible address bar
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      if (oauthError) {
        fail("Deriv login error: " + (errorDescription || oauthError));
        return;
      }

      if (!code || !state) {
        fail("No authorization code received. Please start from the login page.");
        return;
      }

      const pkce = DerivAuth.readPkce();

      if (
        !pkce.state ||
        state !== pkce.state ||
        !pkce.verifier
      ) {
        fail("Security verification failed. Please start login again.");
        return;
      }

      say("Exchanging your secure authorization code...");

      try {
        const response = await fetch("/api/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          cache: "no-store",
          body: JSON.stringify({
            client_id: DerivAuth.CLIENT_ID,
            code: code,
            code_verifier: pkce.verifier,
            redirect_uri: DerivAuth.REDIRECT_URI
          })
        });

        const data = await response.json();

        if (!response.ok || !data.access_token) {
          throw new Error(
            data.error_description ||
            data.error ||
            "Token exchange failed."
          );
        }

        DerivAuth.saveToken(
          data.access_token,
          data.expires_in
        );

        DerivAuth.clearPkce();

        say("Login successful. Retrieving your demo accounts...");

        const accounts = await DerivAuth.getAccounts();

        displayAccounts(accounts);
        populateDemoAccounts(accounts);

      } catch(error) {
        console.error("TradersKit login error:", error);

        fail("Login could not be completed: " + error.message);
      }

    })();
  </script>

</body>
</html>
