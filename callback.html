<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dollarprinter — Logging in</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .acct-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.85rem; text-align: left; }
    .acct-row b.demo { color: var(--green); }
    .acct-row b.real { color: var(--red); }
    #status.ok { color: var(--green); }
    #status.bad { color: var(--red); }
  </style>
</head>
<body class="landing-body">

  <div class="terminal-card-container" style="max-width: 560px; margin: 90px auto; text-align: center;">
    <div class="brand-logo-text" style="margin-bottom: 18px;">
      <span class="logo-box-red">Dollar</span><span class="logo-text-white">printer</span>
    </div>
    <h2>Logging you in</h2>
    <p id="status" style="margin: 14px 0; line-height: 1.6; color: var(--text-muted);">Checking your login...</p>
    <div id="accounts"></div>
    <div id="actions" style="margin-top: 20px; display: none;">
      <a href="dashboard.html" class="btn-hero-start" style="display: inline-block;">Go to Dashboard &rarr;</a>
    </div>
    <p id="retry" style="margin-top: 16px; display: none;"><a href="login.html" style="color: var(--cyan);">Try logging in again</a></p>
  </div>

  <script src="deriv-auth.js"></script>
  <script>
    const statusEl = document.getElementById("status");

    function say(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function fail(text) {
      say(text, "bad");
      document.getElementById("retry").style.display = "block";
    }

    async function showAccounts(token) {
      try {
        const res = await fetch("https://api.derivws.com/trading/v1/options/accounts", {
          headers: { Authorization: "Bearer " + token }
        });
        const json = await res.json();
        const list = Array.isArray(json.data) ? json.data : [];

        if (!res.ok || !list.length) {
          say("You are logged in, but no accounts were listed. If you have no Deriv demo account yet, create one on Deriv and log in again.", "ok");
          return;
        }

        const box = document.getElementById("accounts");
        list.forEach(function (a) {
          const row = document.createElement("div");
          row.className = "acct-row";

          const left = document.createElement("span");
          left.textContent = a.account_id;

          const type = document.createElement("b");
          type.textContent = a.account_type === "real" ? "REAL" : "DEMO";
          type.className = a.account_type === "real" ? "real" : "demo";

          const right = document.createElement("span");
          right.textContent = Number(a.balance).toFixed(2) + " " + a.currency;

          row.appendChild(left);
          row.appendChild(type);
          row.appendChild(right);
          box.appendChild(row);
        });
        say("You are logged in. These are your Deriv accounts:", "ok");
      } catch (e) {
        say("You are logged in, but your accounts could not be read from the browser (" + e.message + "). We will handle this in the next step.", "ok");
      }
    }

    (async function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");
      const errorText = params.get("error_description");

      // Remove the code from the address bar straight away
      window.history.replaceState({}, document.title, window.location.pathname);

      if (error) { fail("Deriv said: " + (errorText || error)); return; }
      if (!code || !state) { fail("This page needs to be opened by Deriv after you log in."); return; }

      const pkce = DerivAuth.readPkce();
      if (!pkce.state || state !== pkce.state || !pkce.verifier) {
        fail("The login could not be checked (the security code did not match). Please start again from the login page.");
        return;
      }

      say("Finishing your login...");

      try {
        const res = await fetch("/api/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_id: DerivAuth.CLIENT_ID,
            code: code,
            code_verifier: pkce.verifier,
            redirect_uri: DerivAuth.REDIRECT_URI
          })
        });
        const data = await res.json().catch(function () { return {}; });

        if (!res.ok || !data.access_token) {
          throw new Error(data.error_description || data.error || "token request failed (" + res.status + ")");
        }

        DerivAuth.saveToken(data.access_token, data.expires_in);
        DerivAuth.clearPkce();
        document.getElementById("actions").style.display = "block";
        await showAccounts(data.access_token);
      } catch (e) {
        fail("Login failed: " + e.message);
      }
    })();
  </script>
</body>
</html>
